<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1652d8"/>
      <stop offset="50%" stop-color="#7a1fc0"/>
      <stop offset="100%" stop-color="#c8129e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="100" height="100" fill="#ffffff"/>

  <!-- SC monogram -->
  <text x="50" y="58"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="46"
        letter-spacing="-2"
        fill="#3f444a"
        text-anchor="middle">SC</text>

  <!-- gradient underline -->
  <rect x="18" y="76" width="64" height="6" rx="3" fill="url(#barGradient)"/>
</svg>
